/* Reset di base del box-model */
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#05050b;--card:rgba(255,255,255,.03);--border:rgba(255,255,255,.06);
  --gold:#fbbf24;--pink:#f472b6;--purple:#818cf8;--green:#10b981;--red:#ef4444;
  --panel-bg: rgba(13, 13, 25, 0.7);
}

html,body{min-height:100vh;background:var(--bg);color:#fff;font-family:'Nunito','Segoe UI',sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}

.wrap{max-width:950px;margin:0 auto;padding:20px 13px 100px}

/* Elementi d'impatto grafici (Gamification) */
.logo{font-family:'Bebas Neue',sans-serif;font-size:54px;letter-spacing:5px;
  background:linear-gradient(90deg,var(--gold),var(--pink),var(--purple));
  background-size:200% auto;line-height:1;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center;transition:transform .2s}
.kpi-val{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--purple);letter-spacing:1px}
.kpi-lbl{font-size:9px;opacity:.4;letter-spacing:2px;margin-top:2px}

.tabs{display:flex;gap:4px;background:rgba(0,0,0,.4);border-radius:14px;padding:4px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;border:none;border-radius:10px;padding:9px 13px;cursor:pointer;font-size:11px;font-weight:800;background:transparent;color:rgba(255,255,255,.4);transition:all .2s;font-family:inherit;white-space:nowrap}
.tab-btn.on{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 3px 12px rgba(99,102,241,.4)}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:9px;transition:transform .2s,box-shadow .2s;animation:fadeUp .35s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.4)}

.ava{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.badge{font-size:10px;border-radius:20px;padding:2px 8px;font-weight:700;border:1px solid}
.bar-wrap{height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:6px}
.bar{height:100%;border-radius:99px;transition:width .8s ease}
.mini-bars{display:flex;gap:4px;align-items:flex-end;margin-top:6px}
.mini-bar-col{display:flex;flex-direction:column;align-items:center;gap:2px}
.mini-bar{width:20px;border-radius:3px;transition:height .4s}
.mini-lbl{font-size:8px;opacity:.4}

.form-box{background:var(--panel-bg);border:1px solid var(--border);border-radius:20px;padding:20px;backdrop-filter:blur(10px)}
.form-lbl{font-size:10px;opacity:.6;letter-spacing:1px;font-weight:800;display:block;margin-bottom:6px}
select,input[type=text],input[type=number],input[type=password]{
  background:rgba(255,255,255,.04)!important;border:1px solid rgba(255,255,255,.08)!important;
  border-radius:10px!important;color:#fff!important;padding:10px 13px!important;
  width:100%!important;font-size:14px!important;outline:none!important;font-family:inherit!important;box-sizing:border-box!important}

.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:900;width:100%;cursor:pointer;font-family:inherit;transition:all .2s;text-transform:uppercase;letter-spacing:1px}
.preview-box{background:rgba(129,140,248,.08);border:1px solid rgba(129,140,248,.2);border-radius:12px;padding:11px 14px;font-size:13px}
.log-item{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 15px;margin-bottom:7px;display:flex;align-items:flex-start;gap:11px}

/* CSS GRID ABILITÀ E ASSIGNAZIONE */
.admin-grid-layout {
  display: grid;
  grid-template-columns: 310px 1fr;
  gap: 20px;
  align-items: start;
  animation: fadeUp .4s ease;
}
.actions-panel-title {

  align-items: center;
  gap: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  padding-bottom: 6px;
}
.actions-game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
  gap: 10px;
}

.action-game-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.01), rgba(255,255,255,0.03));
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 12px;
  color: #fff;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  font-family: inherit;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  text-align: left;
}
.action-game-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.18); }
.action-game-card-lbl { font-size: 12px; line-height: 1.4; font-weight: 700; opacity: 0.85; }
.action-game-card-pts {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  background: rgba(0,0,0,0.2);
  padding: 2px 8px;
  border-radius: 8px;
  align-self: flex-end;
}

.action-game-card.sel-bonus {
  border-color: var(--green) !important;
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(16, 185, 129, 0.02)) !important;
  box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
}
.action-game-card.sel-bonus .action-game-card-pts { color: var(--green); }

.action-game-card.sel-malus {
  border-color: var(--red) !important;
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.12), rgba(239, 68, 68, 0.02)) !important;
  box-shadow: 0 0 15px rgba(239, 68, 68, 0.15);
}
.action-game-card.sel-malus .action-game-card-pts { color: var(--red); }

.console-box { border: 1px solid rgba(251,191,36,0.12); border-radius: 16px; padding: 14px; }
.admin-bar{background:linear-gradient(90deg,rgba(99,102,241,.2),rgba(139,92,246,.1));border-bottom:1px solid rgba(129,140,248,.2);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700}
.lock-overlay{position:fixed;inset:0;background:rgba(7,7,14,.96);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(4px)}
.lock-box{background:#12121e;border:1px solid rgba(129,140,248,.25);border-radius:20px;padding:32px 28px;max-width:340px;width:90%;text-align:center}
.toast{position:fixed;top:18px;right:18px;z-index:9999;border-radius:14px;padding:11px 20px;font-weight:800;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.5);animation:slideIn .3s ease}
.spinner{width:40px;height:40px;border:3px solid rgba(129,140,248,.2);border-top-color:var(--purple);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
.profilo-overlay{position:fixed;inset:0;background:rgba(7,7,14,.97);z-index:500;overflow-y:auto;animation:fadeUp .3s ease}
.profilo-wrap{max-width:500px;margin:0 auto;padding:20px 14px 60px}
.profilo-header{border-radius:24px;padding:28px 24px;margin-bottom:18px;text-align:center}
.profilo-ava{width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; font-weight:900; background:rgba(129,140,248,.2); border:2px solid var(--purple);}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
.stat-box{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 8px;text-align:center}
.trofeo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.trofeo-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 10px;text-align:center}

@media(max-width: 820px) {
  .admin-grid-layout { grid-template-columns: 1fr; gap: 16px; }
  .kpi-grid { grid-template-columns: repeat(2,1fr); }
  .trofeo-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

function titolo(pts){
  if(pts>=800)return{label:"Leggenda",emoji:"👑",color:"#fbbf24"};
  if(pts>=500)return{label:"Campione",emoji:"🏆",color:"#f59e0b"};

//  METODI CORE DI RENDERING
// ═══════════════════════════════════════════════════════════
function sortedSoci(){ return[...STATE.soci].map(s=>({...s,punti:ptTotali(s)})).sort((a,b)=>{ if(a.uscito&&!b.uscito)return 1; if(!a.uscito&&b.uscito)return -1; return b.punti-a.punti; }); }
function getTabs(){ const t=["🏆 Classifica", "🏅 Bacheca", "📜 Regolamento", "🎬 Tutorial", "📋 Log", "🔍 Cerca"]; if(STATE.isAdmin) t.push("➕ Assegna"); return t; }

function render(){ renderKPI(); renderTabs(); renderTab(); }

function renderKPI(){
  const cl=sortedSoci(); const media=Math.round(cl.filter(s=>!s.uscito).reduce((a,s)=>a+s.punti,0)/Math.max(cl.filter(s=>!s.uscito).length,1));
  document.getElementById("kpiGrid").innerHTML=[
    {icon:"👥",val:STATE.soci.filter(s=>!s.uscito).length, label:"SOCI"},
    {icon:"🥇",val:cl[0]?.nome?.split(" ")[0]||"-",        label:"LEADER"},
    {icon:"⭐",val:cl[0]?.punti??0,                        label:"TOP PT"},
    {icon:"📊",val:media,                                   label:"MEDIA PT"},
  ].map(k=>`<div class="kpi"><div style="font-size:18px">${k.icon}</div><div class="kpi-val">${k.val}</div><div class="kpi-lbl">${k.label}</div></div>`).join("");
}

function renderTabs(){ document.getElementById("tabBar").innerHTML=getTabs().map((t,i)=>`<button class="tab-btn${STATE.tab===i?" on":""}" onclick="setTab(${i})">${t}</button>`).join(""); }
function setTab(i){STATE.tab=i; render();}

function renderTab(){
  const label=getTabs()[STATE.tab]||""; const el=document.getElementById("tabContent");
  if(label.includes("Classifica")) el.innerHTML=renderClassifica();
  else if(label.includes("Bacheca")) el.innerHTML=renderBacheca();
  else if(label.includes("Regolamento")) el.innerHTML=renderRegolamento();
  else if(label.includes("Tutorial")) el.innerHTML=renderTutorial();
  else if(label.includes("Log")) el.innerHTML=renderLog();
  else if(label.includes("Cerca")) el.innerHTML=renderCerca();
}

function renderClassifica(){
  const cl=sortedSoci(); const maxM=Math.max(...STATE.soci.flatMap(s=>s.m).filter(v=>v!==null),1);
  return cl.map((s,i)=>{
    const t=titolo(s.punti);
    const bars=s.m.map((mv,mi)=>{
      if(mv===null)return`<div class="mini-bar-col"><div class="mini-bar" style="height:3px;background:rgba(255,255,255,.1)"></div><div class="mini-lbl">${MESE_LABELS[mi]?.slice(0,3)}</div></div>`;
      return`<div class="mini-bar-col"><div class="mini-bar" style="height:${Math.max(3,Math.abs(mv)/maxM*26)}px;background:${mv>=0?"#818cf899":"rgba(239,68,68,.6)"}"></div><div class="mini-lbl">${MESE_LABELS[mi]?.slice(0,3)}</div></div>`;
    }).join("");
    return`<div class="card" onclick="apriProfilo(${s.id})" style="cursor:pointer;${s.uscito?"opacity:.45;":""}">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="font-size:22px;min-width:28px;text-align:center">${i<3?MEDAGLIE[i]:"#"+(i+1)}</div>
        <div class="ava" style="width:44px;height:44px;background:rgba(129,140,248,.2);border:2px solid rgba(129,140,248,.4)">${s.avatar}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:14px;">${s.nome} <span class="badge" style="color:${t.color};border-color:${t.color}35">${t.emoji} ${t.label}</span></div>
          <div class="mini-bars">${bars}</div>
        </div>
        <div style="text-align:right;"><div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:${t.color};">${s.punti}</div></div>
      </div>
    </div>`;
  }).join("");
}

function apriProfilo(id){
  const s=STATE.soci.find(x=>x.id===id); if(!s)return;
  const overlay=document.getElementById("profiloOverlay"); overlay.style.display="block";
  const cl=sortedSoci(); const pos=cl.findIndex(x=>x.id===id)+1;
  overlay.innerHTML=`
  <div class="profilo-wrap">
    <button onclick="chiudiProfilo()" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;padding:10px 18px;cursor:pointer;margin-bottom:16px;">← Chiudi</button>
    <div class="profilo-header" style="background:var(--panel-bg); border:1px solid var(--border); padding:20px; border-radius:16px; margin-bottom:12px;">
      <div class="profilo-ava" style="width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; font-weight:900; background:rgba(129,140,248,.2); border:2px solid var(--purple);">${s.avatar}</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:32px; text-align:center;">${s.nome}</div>
    </div>
    <div class="stat-grid" style="margin-bottom:12px;">
      <div class="stat-box"> <div style="font-family:'Bebas Neue',sans-serif; font-size:24px;">${ptTotali(s)}</div> <div style="font-size:9px; opacity:0.5;">PUNTI TOT</div> </div>
      <div class="stat-box"> <div style="font-family:'Bebas Neue',sans-serif; font-size:24px;">#${pos}</div> <div style="font-size:9px; opacity:0.5;">POSIZIONE</div> </div>
    </div>
    <div style="background:var(--panel-bg);border:1px solid var(--border);border-radius:14px;padding:14px;">
      <div style="font-size:11px;opacity:.5;margin-bottom:10px;font-weight:800;">📈 PUNTEGGI DETTAGLIATI MESI PRECEDENTI</div>
      ${s.m.map((v,i)=>{
        if(v === null) return '';
        const maxV=Math.max(...s.m.map(x => Math.abs(x || 1)), 1);
        return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
          <div style="font-size:12px;font-weight:700;min-width:65px">${MESE_LABELS[i]}</div>
          <div style="flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden">
            <div style="height:100%;width:${Math.abs(v)/maxV*100}%;background:${v>0?"var(--green)":"var(--red)"};"></div>
          </div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:${v>=0?"var(--green)":"var(--red)"};min-width:45px;text-align:right">${v>0?"+":""}${v} pt</div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}
function chiudiProfilo(){document.getElementById("profiloOverlay").style.display="none";}

function renderLog(){
  if(!STATE.log.length) return `<div style="text-align:center;opacity:.3;padding:40px">Registro attività vuoto.</div>`;
  const intestazione = STATE.isAdmin ? `<div style="background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.15);border-radius:12px;padding:12px;font-size:12px;margin-bottom:12px;">🗑️ Modalità amministratore: Clicca <strong>Annulla</strong> per stornare.</div>` : '';
  return `${intestazione}
    ${STATE.log.map(l=>{
      const btn = STATE.isAdmin ? `<button onclick="rimuoviDalLog(${l.id})" style="background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.2);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:11px;">✕ Annulla</button>` : '';
      return `<div class="log-item" style="align-items:center;">
        <div style="flex:1;">
          <div style="font-weight:800;font-size:14px">${l.socio}</div>
          <div style="font-size:12px;opacity:0.6;">${l.azione} ${l.nota?` - 📝 ${l.nota}`:''}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:${l.delta>0?'var(--green)':'var(--red)'}">${l.delta>0?'+':''}${l.delta}</div>
          ${btn}
        </div>
      </div>`;
    }).join("")}`;
}

function rimuoviDalLog(logId){
  if(!STATE.isAdmin) return;
  const entry=STATE.log.find(l=>l.id===logId); if(!entry) return;
  if(!confirm(`Annullare "${entry.azione}" per ${entry.socio}?`)) return;
  const socio=STATE.soci.find(s=>s.nome===entry.socio);
  if(socio){
    STATE.soci=STATE.soci.map(s=>{
      if(s.nome!==entry.socio) return s;
      const nuoviM=[...s.m]; nuoviM[3]=(nuoviM[3]||0)-entry.delta; return{...s,m:nuoviM};
    });
    window._fb.set(window._fb.ref(window._fb.db,"extra/m3/"+socio.id), STATE.soci.find(s=>s.id===socio.id).m[3]);
  }
  STATE.log=STATE.log.filter(l=>l.id!==logId); fbSaveLog(); render();
}

// ── TAB ASSEGNA - STRUTTURA A DUE COLONNE AD IMPATTO VISIVO ──
function renderAssegna(){
  if(!STATE.isAdmin) return `<div style="text-align:center;padding:40px;opacity:.5;">🔒 Pannello riservato agli amministratori.</div>`;
  const opts=[...STATE.soci].filter(s=>!s.uscito).sort((a,b)=>a.nome.localeCompare(b.nome)).map(s=>`<option value="${s.id}">${s.nome} (${ptTotali(s)}pt)</option>`).join("");

  const renderActionGameCard=(a, tipo)=>{
    const isSel=STATE.selAzione===a.id;
    const cls=isSel?(tipo==="bonus"?"action-game-card sel-bonus":"action-game-card sel-malus"):"action-game-card";
    return `<button class="${cls}" onclick="selAzione('${a.id}')">
        <span class="action-game-card-lbl">${a.emoji} ${a.label}</span>
        <span class="action-game-card-pts" style="color:${tipo==="bonus"?"var(--green)":"var(--red)"}">${a.pts>0?"+":""}${a.custom?"var":a.pts}PT</span>
      </button>`;
  };

  const selA=STATE.selAzione?[...BONUS,...MALUS].find(a=>a.id===STATE.selAzione):null;
  const socioSel=STATE.soci.find(s=>s.id===parseInt(STATE.selSocio));
  const customBlock=selA?.custom?`<div style="margin-top:10px;background:rgba(255,255,255,0.02);padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.04)"><label class="form-lbl">VALORE VARIABILE</label><input type="number" min="1" value="${STATE.customVal}" oninput="STATE.customVal=Math.max(1,parseInt(this.value)||1);document.getElementById('gamePreviewCalc').textContent='= '+( ${selA.pts} * this.value )+' punti'"/><div id="gamePreviewCalc" style="font-size:12px;color:var(--purple);font-weight:800;margin-top:4px;">= ${selA.pts*(STATE.customVal||1)} punti</div></div>`:"";
  const previewBlock=selA&&socioSel?`<div class="preview-box" style="margin-top:10px;"><span style="opacity:.65">Inviando </span><span style="font-weight:900;color:${selA.pts>0?"var(--green)":"var(--red)"}">${selA.custom?selA.pts*(STATE.customVal||1):selA.pts} PT</span><span style="opacity:.65"> verso </span><span style="font-weight:900;color:var(--purple);">${socioSel.nome}</span></div>`:"";

  return `<div class="admin-grid-layout">
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div class="form-box">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--purple);margin-bottom:12px">PLANCIA DI INVIO</div>
          <label class="form-lbl">🎯 SOCIO BERSAGLIO</label>
          <select id="socioSelectField" onchange="STATE.selSocio=this.value; renderTab();"><option value="">— Seleziona —</option>${opts}</select>
          <script>document.getElementById('socioSelectField').value="${STATE.selSocio}";<\/script>
          ${customBlock}
          <label class="form-lbl" style="margin-top:10px;">📝 INSERISCI NOTA</label>
          <input type="text" placeholder="Note facoltative…" value="${STATE.nota}" oninput="STATE.nota=this.value" style="margin-bottom:12px"/>
          ${previewBlock}
          <button class="btn-primary" onclick="assegna()" style="margin-top:8px;">🚀 Registra Attività</button>
        </div>
        <div class="form-box console-box">
          <div style="font-size:11px;color:var(--gold);font-weight:900;letter-spacing:1px;margin-bottom:8px">✏️ PUNTEGGIO STRAORDINARIO</div>
          <input type="text" id="customDesc" placeholder="Descrizione attività…" style="margin-bottom:6px; font-size:12px!important;"/>
          <input type="number" id="customPts" placeholder="Punti" style="margin-bottom:10px; text-align:center; font-size:12px!important;"/>
          <button onclick="assegnaPersonalizzato()" style="background:linear-gradient(135deg,#b45309,#d97706);color:#fff;border:none;border-radius:10px;padding:9px;font-weight:900;font-size:11px;cursor:pointer;width:100%;">Inietta Extra Punti</button>
        </div>
      </div>
      <div class="form-box">
        <div class="actions-panel-title" style="color:var(--green)"><span>🟢 TABELLA LIVE ABILITÀ (BONUS)</span></div>
        <div class="actions-game-grid">${BONUS.map(a=>renderActionGameCard(a,"bonus")).join("")}</div>
        <div class="actions-panel-title" style="color:var(--red); margin-top:24px;"><span>🔴 REPERTORIO DELLE DETRAZIONI (MALUS)</span></div>
        <div class="actions-game-grid">${MALUS.map(a=>renderActionGameCard(a,"malus")).join("")}</div>
      </div>
    </div>`;
}

function selAzione(id){STATE.selAzione=STATE.selAzione===id?null:id; renderTab();}

function assegnaPersonalizzato(){
  if(!STATE.selSocio) return showToast("Scegli prima un socio!",true);
  const desc=document.getElementById("customDesc")?.value.trim(); const pts=parseInt(document.getElementById("customPts")?.value);
  if(!desc || isNaN(pts) || pts===0) return showToast("Compila i campi!",true);
  const socio=STATE.soci.find(s=>s.id===parseInt(STATE.selSocio));
  STATE.soci=STATE.soci.map(s=>{ if(s.id!==socio.id)return s; const nuoviM=[...s.m]; nuoviM[3]=(nuoviM[3]||0)+pts; return{...s,m:nuoviM}; });
  STATE.log=[{id:Date.now(),data:new Date().toLocaleDateString("it-IT"),socio:socio.nome,azione:"✏️ "+desc,delta:pts,nota:""},...STATE.log];
  window._fb.set(window._fb.ref(window._fb.db,"extra/m3/"+socio.id), STATE.soci.find(s=>s.id===socio.id).m[3]);
  window._fb.set(window._fb.ref(window._fb.db,"log"), STATE.log);
  showToast("Inserito!"); render();
}

function assegna(){
  if(!STATE.selSocio||!STATE.selAzione)return showToast("Seleziona socio e azione!",true);
  const azione=[...BONUS,...MALUS].find(a=>a.id===STATE.selAzione);
  const delta=azione.pts; const socio=STATE.soci.find(s=>s.id===parseInt(STATE.selSocio));
  STATE.soci=STATE.soci.map(s=>{ if(s.id!==socio.id)return s; const nuoviM=[...s.m]; nuoviM[3]=(nuoviM[3]||0)+delta; return{...s,m:nuoviM}; });
  STATE.log=[{id:Date.now(),data:new Date().toLocaleDateString("it-IT"),socio:socio.nome,azione:azione.label,delta,nota:STATE.nota},...STATE.log];
  window._fb.set(window._fb.ref(window._fb.db,"extra/m3/"+socio.id), STATE.soci.find(s=>s.id===socio.id).m[3]);
  window._fb.set(window._fb.ref(window._fb.db,"log"), STATE.log);
  showToast("Completato!"); STATE.selAzione=null;STATE.nota=""; STATE.customVal=1; render();
}

// ── ALTRE INTERFACCE STRUTTURATE ─────────────────────────────
function renderBacheca(){
  const cl=sortedSoci();
  return `
    <div style="background:var(--panel-bg); border:1px solid var(--border); border-radius:20px; padding:20px; margin-bottom:16px;">
      <div style="font-family:'Bebas Neue',sans-serif; font-size:24px; color:var(--gold); text-align:center; margin-bottom:14px;">🏅 ALBO D'ORO & ECCELLENZE INDIVIDUALI</div>
      <div class="card" style="border-left:4px solid var(--gold);">🏆 **LEADER ASSOLUTO ALL-TIME:** ${cl[0]?.nome || '—'} (${cl[0]?.punti || 0} Punti Generali)</div>

      ${TROFEI.map(tr=>{
        const earners=STATE.soci.filter(s=>tr.check(s));

          <div style="font-size:10px; color:var(--green); font-weight:800; margin-top:6px;">Detentori: ${earners.length>0 ? earners.map(x=>x.nome).join(", ") : 'In attesa'}</div>

}

function renderRegolamento(){
  return `<div style="display:flex; flex-direction:column; gap:10px;">
    ${REGOLE_COMPLETE.map(r=>`
      <div class="card">
        <div style="font-size:11px; color:var(--purple); font-weight:900; text-transform:uppercase;">${r.cat}</div>
        <div style="font-size:13px; margin-top:4px; opacity:0.85; line-height:1.5">${r.testo}</div>
      </div>
    `).join("")}
  </div>`;
}

function renderTutorial(){
  return `
    <div style="text-align:center; margin-bottom:16px;">
      <div style="font-family:'Bebas Neue',sans-serif; font-size:24px; color:var(--pink);">🎬 VIDEO REQUISITI E REGOLAMENTO</div>
    </div>
    <div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:16px; border:1px solid var(--border); background:#000;">
      <iframe src="https://www.youtube.com/embed/SmFlxIyacb8" style="position:absolute; top:0; left:0; width:100%; height:100%; border:none;" allowfullscreen></iframe>
    </div>`;
}

function renderCerca(){
  const query=CERCA_QUERY.toLowerCase(); const risultati=sortedSoci().filter(s=>s.nome.toLowerCase().includes(query));
  return`<div class="cerca-wrap" style="margin-bottom:12px;"><input class="cerca-input" type="text" placeholder="Digita il nome da filtrare…" oninput="CERCA_QUERY=this.value;renderTab()"/></div>
  ${risultati.map(s=>`<div class="card" onclick="apriProfilo(${s.id})" style="cursor:pointer;">${s.nome} (${ptTotali(s)} pt)</div>`).join("")}`;
}
let CERCA_QUERY="";

function aggiornaCountdown(){
  const ora=new Date(); const pross=new Date(); pross.setDate(ora.getDate()+(pross.getDay()===0?1:8-pross.getDay())); pross.setHours(0,0,0,0); const diff=pross-ora;
  const dg=document.getElementById("cdGiorni"); const dh=document.getElementById("cdOre"); const dm=document.getElementById("cdMin");
  if(dg) dg.textContent=String(Math.floor(diff/86400000)).padStart(2,"0");
  if(dh) dh.textContent=String(Math.floor((diff%86400000)/3600000)).padStart(2,"0");
  if(dm) dm.textContent=String(Math.floor((diff%3600000)/60000)).padStart(2,"0");
}

function showAppRoot() {
  const loader = document.getElementById("loadingScreen"); const appRoot = document.getElementById("appRoot");
  if(loader) loader.style.display = "none"; if(appRoot) appRoot.style.display = "block";
  render();
}

// ═══════════════════════════════════════════════════════════
//  SINCRO ENGINE REALTIME ANTI-BLOCCO (FALLBACK INTELLIGENTE)
// ═══════════════════════════════════════════════════════════
window.addEventListener("firebase-ready", () => {
  fbReady = true; const { db, ref, onValue } = window._fb;

  // Meccanismo di sblocco forzato a 2 secondi se la sincronizzazione cloud fallisce
  setTimeout(() => { showAppRoot(); }, 2000);

  onValue(ref(db, "extra"), snap => {
    try {
      const ext = snap.val() || {};
      STATE.soci = SOCI_DEFAULT.map(s => {
        const nm = [...s.m];
        for (let i = 0; i < 6; i++) {
          if (ext["m" + i] && ext["m" + i][s.id] !== undefined) {
            const dm = ext["m" + i][s.id];
            nm[i] = (dm && typeof dm === 'object') ? (dm.value || 0) : dm;
          }
        }
        return { ...s, m: nm };
      });
      showAppRoot();
    } catch (ex) { showAppRoot(); }
  }, err => { showAppRoot(); });

  onValue(ref(db, "log"), snap => {
    try {
      const ld = snap.val(); STATE.log = ld ? (ld.data ? ld.data : (Array.isArray(ld) ? ld : [])) : []; render();
    } catch (e) { render(); }
  }, err => { render(); });

  aggiornaCountdown(); setInterval(aggiornaCountdown, 60000);
});

function apriLocale(){ showAppRoot(); }

let clickCount=0;
document.addEventListener("click",e=>{
  if(e.target.closest(".logo")){clickCount++; if(clickCount>=3){clickCount=0;document.getElementById("lockOverlay").style.display="flex";} setTimeout(()=>clickCount=0,1200);}
});
</script>
