<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--card:rgba(255,255,255,.05);--border:rgba(255,255,255,.08);
  --gold:#fbbf24;--pink:#f472b6;--purple:#818cf8;--green:#10b981;--red:#ef4444;
}
html,body{min-height:100vh;background:var(--bg);color:#fff;font-family:'Nunito','Segoe UI',sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}

.wrap{max-width:700px;margin:0 auto;padding:20px 13px 100px}

.logo{font-family:'Bebas Neue',sans-serif;font-size:54px;letter-spacing:5px;
  background:linear-gradient(90deg,var(--gold),var(--pink),var(--purple));
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center;transition:transform .2s}
.kpi-val{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--purple);letter-spacing:1px}
.kpi-lbl{font-size:9px;opacity:.4;letter-spacing:2px;margin-top:2px}

.tabs{display:flex;gap:4px;background:rgba(0,0,0,.4);border-radius:14px;padding:4px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;border:none;border-radius:10px;padding:9px 13px;cursor:pointer;font-size:11px;font-weight:800;background:transparent;color:rgba(255,255,255,.4);transition:all .2s;font-family:inherit;white-space:nowrap}
.tab-btn.on{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 3px 12px rgba(99,102,241,.4)}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:9px;transition:transform .2s,box-shadow .2s;animation:fadeUp .35s ease}

.ava{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.badge{font-size:10px;border-radius:20px;padding:2px 8px;font-weight:700;border:1px solid}
.bar-wrap{height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:6px}
.bar{height:100%;border-radius:99px;transition:width .8s ease}
.mini-bars{display:flex;gap:4px;align-items:flex-end;margin-top:6px}
.mini-bar-col{display:flex;flex-direction:column;align-items:center;gap:2px}
.mini-bar{width:20px;border-radius:3px;transition:height .4s}
.mini-lbl{font-size:8px;opacity:.4}

.form-box{background:rgba(255,255,255,.04);border:1px solid rgba(129,140,248,.16);border-radius:20px;padding:20px}
.form-lbl{font-size:10px;opacity:.5;letter-spacing:2px;display:block;margin-bottom:6px}
select,input[type=text],input[type=number],input[type=password]{
  background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.12)!important;
  border-radius:10px!important;color:#fff!important;padding:10px 13px!important;
  width:100%!important;font-size:14px!important;outline:none!important;font-family:inherit!important;box-sizing:border-box!important}

.azione-btn{border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 12px;background:rgba(255,255,255,.03);color:#fff;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:inherit;transition:all .15s;width:100%;margin-bottom:4px;font-size:12px;font-weight:600}
.azione-btn.sel-bonus{border-color:var(--green)!important;background:rgba(16,185,129,.12)!important}
.azione-btn.sel-malus{border-color:var(--red)!important;background:rgba(239,68,68,.12)!important}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:800;width:100%;cursor:pointer;font-family:inherit;transition:opacity .18s,transform .15s}
.preview-box{background:rgba(129,140,248,.1);border:1px solid rgba(129,140,248,.22);border-radius:11px;padding:11px 14px;margin-bottom:13px;font-size:13px}

.admin-bar{background:linear-gradient(90deg,rgba(99,102,241,.2),rgba(139,92,246,.1));border-bottom:1px solid rgba(129,140,248,.2);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700}
.lock-overlay{position:fixed;inset:0;background:rgba(7,7,14,.96);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(4px)}
.lock-box{background:#12121e;border:1px solid rgba(129,140,248,.25);border-radius:20px;padding:32px 28px;max-width:340px;width:90%;text-align:center}
.toast{position:fixed;top:18px;right:18px;z-index:9999;border-radius:14px;padding:11px 20px;font-weight:800;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.5);animation:slideIn .3s ease}
.spinner{width:40px;height:40px;border:3px solid rgba(129,140,248,.2);border-top-color:var(--purple);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
.profilo-overlay{position:fixed;inset:0;background:rgba(7,7,14,.97);z-index:500;overflow-y:auto;animation:fadeUp .3s ease}
.profilo-wrap{max-width:500px;margin:0 auto;padding:20px 14px 60px}
.profilo-header{border-radius:24px;padding:28px 24px;margin-bottom:18px;text-align:center;position:relative}
.profilo-ava{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;margin:0 auto 12px;background:rgba(129,140,248,.2);border:2px solid var(--purple);}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
.stat-box{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 8px;text-align:center}
.countdown-box{background:linear-gradient(135deg,rgba(129,140,248,.15),rgba(139,92,246,.08));border:1px solid rgba(129,140,248,.25);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:16px}
.countdown-num{font-family:"Bebas Neue",sans-serif;font-size:32px;color:var(--purple);letter-spacing:2px;min-width:36px;text-align:center}
.countdown-lbl{font-size:9px;opacity:.5;letter-spacing:2px;text-align:center;margin-top:2px}
.trofeo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.trofeo-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 10px;text-align:center}
.cerca-input{background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.15)!important;border-radius:14px!important;color:#fff!important;padding:12px 16px 12px 42px!important;width:100%!important;font-size:15px!important;outline:none!important;font-family:inherit!important;box-sizing:border-box!important}
.cerca-wrap{position:relative;margin-bottom:16px}
.cerca-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}

@media(max-width:420px){
  .logo{font-size:40px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .trofeo-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

const SOCI_DEFAULT = [

  {id:6, nome:"Danilo",           avatar:"DA", m:[265,60,10,   0,0,0]},
  {id:24,nome:"Maria",            avatar:"MA", m:[null,null,null,0,0,0]},
  {id:4, nome:"Giorgia",          avatar:"GG", m:[345,65,100,  0,0,0]},

];

const MESE_LABELS  = ["Marzo","Aprile","Maggio","Giugno","Luglio","Agosto"];

const BONUS = [
  {id:"b1", label:"Presenza in sede / evento / riunione",       pts:50,  emoji:"🏠"},
  {id:"b2", label:"Delegato per un giorno",                      pts:30,  emoji:"🎖️"},

  {id:"b11",label:"Arrivato in orario",                         pts:10,  emoji:"⏰"},
];
const MALUS = [
  {id:"m1", label:"Sparire senza avvisare",                     pts:-30, emoji:"👻"},
  {id:"m2", label:"Non rispondere per ore",                     pts:-20, emoji:"👀"},
  {id:"m4", label:"Domanda ripetuta",                           pts:-10, emoji:"🤦"},
  {id:"m5", label:"Citato il FantaSocio",                       pts:-10, emoji:"🤫"},
  {id:"m6", label:"Lamentarsi senza soluzioni",                 pts:-15, emoji:"😤"},
];

const TROFEI = [
  {id:"t1", emoji:"👑", nome:"Leggenda",     desc:"Supera 800 punti totali",     check:s=>ptTotali(s)>=800},
  {id:"t2", emoji:"🏆", nome:"Campione",     desc:"Supera 500 punti totali",     check:s=>ptTotali(s)>=500},
  {id:"t3", emoji:"🌟", nome:"Attivo",       desc:"Supera 100 punti totali",     check:s=>ptTotali(s)>=100}
];

const REGOLE_COMPLETE = [
  {cat:"🎮 Come funziona", testo:"Si gioca a punti (bonus e malus). L'obiettivo è fare cose utili divertendosi! Classifiche mensili per il Socio del Mese e annuali per il Socio dell'Anno."},
  {cat:"⚙️ Apertura Sessioni", testo:"La classifica del Socio del Mese si apre ogni primo lunedì del mese. Un nuovo socio che si aggiunge inizierà a giocare dal mese successivo."},
  {cat:"✅ Tabella Bonus", testo:"Presenza in sede, evento o riunione → +50 pt | Delegato/a per un giorno per un'iniziativa CFP → +30 pt | Post sui social di spontanea volontà → +10 pt"},
  {cat:"❌ Tabella Malus", testo:"Dici 'ci sono' e sparisci senza avvisare → -30 pt | Leggi un messaggio e non rispondi per ore → -20 pt | Citi direttamente o indirettamente il FantaSocio → -10 pt"}
];

const MEDAGLIE = ["🥇","🥈","🥉"];
let STATE = { soci:SOCI_DEFAULT, log:[], isAdmin:false, tab:0, selAzione:null, selSocio:"", customVal:1, nota:"" };
let fbReady=false;

function titolo(pts){
  if(pts>=800)return{label:"Leggenda",emoji:"👑",color:"#fbbf24"};
  if(pts>=500)return{label:"Campione",emoji:"🏆",color:"#f59e0b"};
  if(pts>=250)return{label:"Veterano",emoji:"⭐",color:"#10b981"};
  return{label:"In gioco",emoji:"🌱",color:"#94a3b8"};
}

function sortedSoci(){ return[...STATE.soci].map(s=>({...s,punti:ptTotali(s)})).sort((a,b)=>{ if(a.uscito&&!b.uscito)return 1; if(!a.uscito&&b.uscito)return -1; return b.punti-a.punti; }); }
function getTabs(){ const t=["🏆 Classifica", "🏅 Bacheca", "📜 Regolamento", "🎬 Tutorial", "📋 Log", "🔍 Cerca"]; if(STATE.isAdmin) t.push("➕ Assegna"); return t; }

function render(){ renderKPI(); renderTabs(); renderTab(); }

function renderKPI(){
  const cl=sortedSoci(); const media=Math.round(cl.filter(s=>!s.uscito).reduce((a,s)=>a+s.punti,0)/Math.max(cl.filter(s=>!s.uscito).length,1));
  document.getElementById("kpiGrid").innerHTML=[
    {icon:"👥",val:STATE.soci.filter(s=>!s.uscito).length, label:"SOCI"},
    {icon:"🥇",val:cl[0]?.nome?.split(" ")[0]||"-",        label:"LEADER"},
    {icon:"⭐",val:cl[0]?.punti??0,                        label:"TOP PT"},
    {icon:"📊",val:media,                                   label:"MEDIA PT"},
  ].map(k=>`<div class="kpi"><div style="font-size:18px">${k.icon}</div><div class="kpi-val">${k.val}</div><div class="kpi-lbl">${k.label}</div></div>`).join("");
}

function renderTabs(){ document.getElementById("tabBar").innerHTML=getTabs().map((t,i)=>`<button class="tab-btn${STATE.tab===i?" on":""}" onclick="setTab(${i})">${t}</button>`).join(""); }
function setTab(i){STATE.tab=i; render();}

function renderTab(){
  const label=getTabs()[STATE.tab]||""; const el=document.getElementById("tabContent");
  if(label.includes("Classifica")) el.innerHTML=renderClassifica();
  else if(label.includes("Bacheca")) el.innerHTML=renderBacheca();
  else if(label.includes("Regolamento")) el.innerHTML=renderRegolamento();
  else if(label.includes("Tutorial")) el.innerHTML=renderTutorial();
  else if(label.includes("Log")) el.innerHTML=renderLog();
  else if(label.includes("Cerca")) el.innerHTML=renderCerca();
  else if(label.includes("Assegna")) el.innerHTML=renderAssegna();
}

function renderClassifica(){
  const cl=sortedSoci(); const maxM=Math.max(...STATE.soci.flatMap(s=>s.m).filter(v=>v!==null),1);
  return cl.map((s,i)=>{
    const t=titolo(s.punti);
    const bars=s.m.map((mv,mi)=>{
      if(mv===null)return`<div class="mini-bar-col"><div class="mini-bar" style="height:3px;background:rgba(255,255,255,.1)"></div><div class="mini-lbl">${MESE_LABELS[mi]?.slice(0,3)}</div></div>`;
      return`<div class="mini-bar-col"><div class="mini-bar" style="height:${Math.max(3,Math.abs(mv)/maxM*26)}px;background:${mv>=0?"#818cf899":"rgba(239,68,68,.6)"}"></div><div class="mini-lbl">${MESE_LABELS[mi]?.slice(0,3)}</div></div>`;
    }).join("");
    return`<div class="card" onclick="apriProfilo(${s.id})" style="cursor:pointer;${s.uscito?"opacity:.45;":""}">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="font-size:22px;min-width:28px;text-align:center">${i<3?MEDAGLIE[i]:"#"+(i+1)}</div>
        <div class="ava" style="width:4
